<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo Máximo</title>
  <style>
    body {
      margin: 0;
      padding: 24px 12px;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1e293b;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 530px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header h3 { margin: 0; font-size: 17px; }
    .header p { margin: 2px 0 0; font-size: 12px; color: #64748b; }

    .total-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: right;
    }

    .total-box span { display: block; font-size: 10px; color: #1d4ed8; text-transform: uppercase; font-weight: 600; }
    .total-box strong { font-size: 16px; color: #1e40af; }

    .svg-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
    }

    svg { width: 100%; height: auto; display: block; }

    .nodo.fuente { fill: #10b981; }
    .nodo.sumidero { fill: #8b5cf6; }
    .nodo.intermedio { fill: #3b82f6; }

    .txt-nodo { fill: #fff; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .txt-nombre { font-size: 10px; fill: #475569; text-anchor: middle; font-weight: 500; }
    .txt-arista { font-size: 10px; fill: #475569; font-weight: 600; text-anchor: middle; }
    .txt-arista.saturado { fill: #ef4444; font-weight: bold; }

    .controles-titulo {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-top: 14px;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      color: #334155;
    }

    .chip input {
      width: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 12px;
      text-align: center;
    }

    .btn-calcular {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-calcular:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h3>Red de Transporte</h3>
      </div>
      <div class="total-box">
        <span>Flujo Máximo</span>
        <strong id="flujo-maximo">--</strong>
      </div>
    </div>

    <div class="svg-container">
      <svg viewBox="0 0 480 220" id="grafo-svg">
        <defs>
          <marker id="flecha" viewBox="0 0 10 10" refX="21" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
          </marker>
        </defs>
        <g id="capa-aristas"></g>
        <g id="capa-nodos"></g>
      </svg>
    </div>

    <div class="controles-titulo">Ingreso manual de capacidades:</div>
    <div class="controles" id="contenedor-controles"></div>

    <button class="btn-calcular" id="btn-calcular">
      Calcular Flujo Máximo
    </button>
  </div>

  <script>
    const totalNodos = 6;
    const fuente = 0;
    const sumidero = 5;

    const nodos = [
      { id: 0, nombre: 'S', x: 45, y: 110, tipo: 'fuente' },
      { id: 1, nombre: 'A', x: 160, y: 55, tipo: 'intermedio' },
      { id: 2, nombre: 'B', x: 160, y: 165, tipo: 'intermedio' },
      { id: 3, nombre: 'C', x: 300, y: 55, tipo: 'intermedio' },
      { id: 4, nombre: 'D', x: 300, y: 165, tipo: 'intermedio' },
      { id: 5, nombre: 'T', x: 435, y: 110, tipo: 'sumidero' }
    ];

    const rutas = [
      { de: 0, a: 1, cap: 10, flujo: 0 },
      { de: 0, a: 2, cap: 10, flujo: 0 },
      { de: 1, a: 2, cap: 2,  flujo: 0 },
      { de: 1, a: 3, cap: 8,  flujo: 0 },
      { de: 2, a: 4, cap: 9,  flujo: 0 },
      { de: 3, a: 4, cap: 3,  flujo: 0 },
      { de: 3, a: 5, cap: 7,  flujo: 0 },
      { de: 4, a: 5, cap: 8,  flujo: 0 }
    ];

    let calculado = false;

    const nodo = (id) => nodos.find(n => n.id === id);
    const puntoMedio = (de, a, eje) => (nodo(de)[eje] + nodo(a)[eje]) / 2;

    function renderGrafo() {
      const capaAristas = document.getElementById('capa-aristas');
      const capaNodos = document.getElementById('capa-nodos');

      capaAristas.innerHTML = rutas.map(r => {
        const u = nodo(r.de);
        const v = nodo(r.a);
        const saturado = calculado && r.flujo === r.cap && r.cap > 0;
        let color = '#cbd5e1';
        let grosor = 1.5;

        if (calculado && saturado) {
          color = '#ef4444';
          grosor = 2.5;
        } else if (calculado && r.flujo > 0) {
          color = '#3b82f6';
          grosor = 2.5;
        }

        const midX = puntoMedio(r.de, r.a, 'x');
        const midY = puntoMedio(r.de, r.a, 'y') - 6;

        return `
          <line x1="${u.x}" y1="${u.y}" x2="${v.x}" y2="${v.y}" stroke="${color}" stroke-width="${grosor}" marker-end="url(#flecha)"/>
          <text x="${midX}" y="${midY}" class="txt-arista ${saturado ? 'saturado' : ''}">(${r.cap};${r.flujo})</text>
        `;
      }).join('');

      capaNodos.innerHTML = nodos.map(n => `
        <circle cx="${n.x}" cy="${n.y}" r="16" class="nodo ${n.tipo}" />
        <text x="${n.x}" y="${n.y + 4}" class="txt-nodo">${n.id}</text>
        <text x="${n.x}" y="${n.y + 28}" class="txt-nombre">${n.nombre}</text>
      `).join('');
    }

    function renderControles() {
      const contenedor = document.getElementById('contenedor-controles');
      contenedor.innerHTML = rutas.map((r, i) => `
        <div class="chip">
          <span>${r.de} &rarr; ${r.a}</span>
          <input type="number" min="0" max="99" value="${r.cap}" data-index="${i}" />
        </div>
      `).join('');

      contenedor.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index);
          rutas[idx].cap = parseInt(e.target.value) || 0;
          calculado = false;
          rutas.forEach(r => r.flujo = 0);
          document.getElementById('flujo-maximo').textContent = '--';
          renderGrafo();
        });
      });
    }
    function dfs(u, t, visitados, residual, flujoMin) {
      if (u === t) return flujoMin;
      visitados[u] = true;

      for (let v = 0; v < totalNodos; v++) {
        if (!visitados[v] && residual[u][v] > 0) {
          const cuello = dfs(v, t, visitados, residual, Math.min(flujoMin, residual[u][v]));
          if (cuello > 0) {
            residual[u][v] -= cuello;
            residual[v][u] += cuello;
            return cuello;
          }
        }
      }
      return 0;
    }

    function resolver() {
      const residual = Array.from({ length: totalNodos }, () => Array(totalNodos).fill(0));
      rutas.forEach(r => {
        residual[r.de][r.a] = r.cap;
        r.flujo = 0;
      });

      let maxFlow = 0;

      while (true) {
        const visitados = Array(totalNodos).fill(false);
        const cuello = dfs(fuente, sumidero, visitados, residual, Infinity);
        if (cuello === 0) break;
        maxFlow += cuello;
      }

      rutas.forEach(r => {
        r.flujo = r.cap - residual[r.de][r.a];
      });

      calculado = true;
      document.getElementById('flujo-maximo').textContent = `${maxFlow} u/h`;
      renderGrafo();
    }

    document.getElementById('btn-calcular').addEventListener('click', resolver);

    renderGrafo();
    renderControles();
  </script>
</body>
</html>
